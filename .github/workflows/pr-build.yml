name: MarketMage Build and Checks

on:
  push:
    branches: [ master, main, 'dev/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run offline regression checks
        run: dotnet run --project MarketMage.Tests -c Release
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP/dalamud.zip" "$env:AppData/XIVLauncher/addon/Hooks/dev"
      - name: Build plugin
        run: dotnet build MarketMage.sln --configuration Release -p:Platform=x64 -p:RestoreLockedMode=true
      - name: Store plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarketMage
          path: |
            MarketMage/bin/x64/Release/MarketMage.dll
            MarketMage/bin/x64/Release/MarketMage.json
          if-no-files-found: error
          retention-days: 7
