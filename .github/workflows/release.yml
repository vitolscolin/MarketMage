name: Publish Dalamud repository

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: marketmage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run regression checks
        run: dotnet run --project MarketMage.Tests -c Release
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP/dalamud.zip" "$env:AppData/XIVLauncher/addon/Hooks/dev"
      - name: Build plugin
        run: dotnet build MarketMage.sln --configuration Release -p:Platform=x64 -p:RestoreLockedMode=true
      - name: Package plugin and repository JSON
        shell: pwsh
        run: python scripts/package-release.py --tag $env:GITHUB_REF_NAME --repository $env:GITHUB_REPOSITORY
      - name: Publish versioned download and stable repository feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/MarketMage.zip release/pluginmaster.json MarketMage/bin/x64/Release/MarketMage.dll --verify-tag --title "MarketMage $env:GITHUB_REF_NAME" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
